services:
  api:
    build: .
    image: trueiris-api:local
    restart: unless-stopped
    env_file:
      - path: ./deploy/api.env
        format: raw
    environment:
      NODE_ENV: production
      TRUEIRIS_API_HOST: 0.0.0.0
      TRUEIRIS_API_PORT: '3001'
      VULTR_DEPLOYMENT_ENV: production
    expose:
      - '3001'
    volumes:
      - ./deploy/certs:/run/certs:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    stop_grace_period: 30s
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      TRUEIRIS_DOMAIN: ${TRUEIRIS_DOMAIN:?Set TRUEIRIS_DOMAIN to your HTTPS hostname}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
volumes:
  caddy_data:
  caddy_config:
